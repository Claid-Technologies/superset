name: Build fork desktop (macOS arm64, unsigned)

# Builds this fork's desktop app under its own identity ("Superset Direct",
# protocol superset-direct://, home ~/.superset-direct) against the production
# Superset cloud, with auto-update disabled so it never replaces itself with
# the upstream release. Unsigned: run it from a local build/download, not
# from the internet.

on:
  workflow_dispatch:
    inputs:
      workspace_name:
        description: "Baked workspace name (protocol superset-<name>://, home ~/.superset-<name>)"
        required: false
        type: string
        default: direct

permissions:
  contents: read

jobs:
  build-macos-arm64:
    name: Build - macOS (arm64)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ steps.setup-bun.outputs.bun-revision }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ steps.setup-bun.outputs.bun-revision }}-

      - name: Install dependencies
        run: bun install --frozen --ignore-scripts

      - name: Install desktop native dependencies
        working-directory: apps/desktop
        run: bun run install:deps

      - name: Build app (electron-vite + electron-builder, zip only)
        working-directory: apps/desktop
        env:
          NEXT_PUBLIC_API_URL: https://api.superset.sh
          NEXT_PUBLIC_WEB_URL: https://app.superset.sh
          NEXT_PUBLIC_MARKETING_URL: https://superset.sh
          NEXT_PUBLIC_DOCS_URL: https://docs.superset.sh
          NEXT_PUBLIC_STREAMS_URL: https://streams.superset.sh
          RELAY_URL: https://relay.superset.sh
          REALTIME_URL: https://realtime.superset.sh
          SUPERSET_WORKSPACE_NAME: ${{ inputs.workspace_name }}
          SUPERSET_DISABLE_AUTO_UPDATE: "1"
          SUPERSET_FORK_BUILD: "1"
          SUPERSET_APP_ID: com.claid.superset-${{ inputs.workspace_name }}
          SUPERSET_PRODUCT_NAME: Superset ${{ inputs.workspace_name }}
          TARGET_ARCH: arm64
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          NODE_OPTIONS: --max-old-space-size=8192
        run: bun run build -- --mac zip --arm64

      - name: List artifacts
        working-directory: apps/desktop
        run: ls -la release || true

      - name: Upload app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: superset-${{ inputs.workspace_name }}-mac-arm64
          path: |
            apps/desktop/release/*.zip
          retention-days: 14
          if-no-files-found: error
